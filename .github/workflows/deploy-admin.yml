name: Deploy independent FRANKEY admin Worker

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frankey-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Build and deploy frankey-rentals-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build independent administrator
        working-directory: frontend
        run: npm run build:admin

      - name: Verify administrator bundle
        working-directory: frontend
        run: test -s dist-admin/admin.html

      - name: Verify Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Workers Scripts edit permission to the GitHub repository secrets."
            exit 1
          fi

      - name: Deploy administrator Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "31a3697c187c609baaf0b825ea36a74b"
        run: npx wrangler deploy --config wrangler.admin.jsonc
