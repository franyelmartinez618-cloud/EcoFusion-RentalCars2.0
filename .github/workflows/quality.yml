name: Project quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check the existing full-repository ESLint baseline
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      - name: Lint updated runtime and presentation modules
        working-directory: frontend
        run: >-
          npx eslint
          src/App.jsx
          src/components/Navbar/Navbar.jsx
          src/components/Footer/Footer.jsx
          src/pages/Admin/AdminLogin.jsx
          src/pages/About/About.jsx
          src/pages/Contact/Contact.jsx
          src/pages/Home/Home.jsx
          src/pages/HowItWorks/HowItWorks.jsx
          src/pages/Legal/LegalPage.jsx
          src/pages/Vehicles/Vehicles.jsx
          src/pages/VehicleDetails/VehicleDetails.jsx
          src/admin-entry.jsx
          src/services/api.js
          src/services/identity.js
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      - name: Verify the independent admin entry was emitted
        working-directory: frontend
        run: test -s dist/client/admin.html
      - name: Validate the standalone admin Worker configuration
        working-directory: frontend
        run: npx wrangler deploy --dry-run --config wrangler.admin.jsonc

  backend:
    name: Backend compile and security unit tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      MYSQL_URL: sqlite:////tmp/frankey-rentals-ci.sqlite3
      FRONTEND_ORIGIN: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend security tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
